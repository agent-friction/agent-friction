[package]
name = "agent-friction-cli"
description = "Records the permission prompts you answer and the tool calls that fail, then suggests which approvals to stop granting by hand."
edition.workspace = true
version.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Path only, deliberately. A `version` here is needed just for `cargo publish`,
# so the dependency resolves from the registry -- and it would be a second place
# the version lives, drifting silently from the workspace one every release. Add
# it back if these crates ever go to crates.io.
agent-friction-core = { path = "../core" }
anyhow = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
comfy-table = { version = "8.0.0", features = ["custom_styling"] }
interim = { version = "0.2.1", features = ["chrono_0_4"] }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "agent-friction"
path = "src/main.rs"
